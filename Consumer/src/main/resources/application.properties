spring.application.name=Consumer
server.port=8090
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id1=consumer_group1
spring.kafka.consumer.group-id2=consumer_group2
spring.kafka.consumer.topic1=test-topic1
spring.kafka.consumer.topic2=test-topic2
# ?? ?? ???
spring.kafka.consumer.enable-auto-commit=true
# ???? ??? offset? ???? ???? ????? ??
spring.kafka.consumer.auto-offset-reset=latest
# ??? ?? ??
spring.kafka.consumer.group-id=group1

# OAuth2
# ?? ?? url ?? ??
oauth.token.url=https://oauth2.googleapis.com/token
oauth.client.id=your-client-id
oauth.client.secret=your-client-secret
oauth.grant.type=client_credentials

security.protocol=SASL_SSL
# Broker?? ??? mechnism
sasl.mechanism=OAUTHBEARER 
sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;
sasl.oauthbearer.token.endpoint.uri="https://auth-server.com/oauth2/token";

